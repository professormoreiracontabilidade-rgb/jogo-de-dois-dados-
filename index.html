<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo dos Dados</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

.topo{
    background:#08275c;
    padding:18px;
    text-align:center;
    font-size:34px;
    font-weight:bold;
    letter-spacing:2px;
}

.sub{
    text-align:center;
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.area{
    height:75vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

.dados{
    display:flex;
    gap:60px;
    margin-bottom:40px;
}

.dado{
    width:150px;
    height:150px;
    background:white;
    border-radius:25px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:15px;
    box-shadow:0 0 30px rgba(255,255,255,.25);
}

.ponto{
    width:22px;
    height:22px;
    background:#000;
    border-radius:50%;
    justify-self:center;
    align-self:center;
    visibility:hidden;
}

.resultado{
    margin-top:20px;
    font-size:70px;
    font-weight:bold;
    color:#ffd400;
    letter-spacing:5px;
}

.soma{
    margin-top:20px;
    background:#0b8f24;
    padding:15px 45px;
    border-radius:50px;
    font-size:34px;
    font-weight:bold;
}

.rodape{
    position:absolute;
    bottom:25px;
    width:100%;
    text-align:center;
    font-size:20px;
    color:#bbb;
}

.animar{
    animation:girar .7s linear;
}

@keyframes girar{
    0%{transform:rotate(0deg) scale(.8);}
    20%{transform:rotate(180deg) scale(1.1);}
    40%{transform:rotate(360deg);}
    60%{transform:rotate(540deg);}
    80%{transform:rotate(720deg);}
    100%{transform:rotate(900deg);}
}
</style>
</head>

<body>

<div class="topo">
🎲 JOGO DOS DADOS 🎲
</div>

<div class="sub">
Toque em qualquer lugar da tela
</div>

<div class="area" onclick="rolar()">

<div class="dados">

<div class="dado" id="d1">
<div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
<div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
<div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
</div>

<div class="dado" id="d2">
<div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
<div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
<div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
</div>

</div>

<div class="resultado" id="resultado">
1 + 1
</div>

<div class="soma" id="soma">
SOMA = 2
</div>

</div>

<div class="rodape">
Toque para rolar novamente
</div>

<script>

const faces={
1:[4],
2:[0,8],
3:[0,4,8],
4:[0,2,6,8],
5:[0,2,4,6,8],
6:[0,2,3,5,6,8]
};

function desenhar(id,valor){

let pontos=document.querySelectorAll("#"+id+" .ponto");

pontos.forEach(p=>p.style.visibility="hidden");

faces[valor].forEach(i=>{
pontos[i].style.visibility="visible";
});

}

function sorteio(){
return Math.floor(Math.random()*6)+1;
}

function rolar(){

let dado1=document.getElementById("d1");
let dado2=document.getElementById("d2");

dado1.classList.add("animar");
dado2.classList.add("animar");

let intervalo=setInterval(()=>{

let a=sorteio();
let b=sorteio();

desenhar("d1",a);
desenhar("d2",b);

},80);

setTimeout(()=>{

clearInterval(intervalo);

let a=sorteio();
let b=sorteio();

desenhar("d1",a);
desenhar("d2",b);

document.getElementById("resultado").innerHTML=a+" + "+b;
document.getElementById("soma").innerHTML="SOMA = "+(a+b);

dado1.classList.remove("animar");
dado2.classList.remove("animar");

},900);

}

desenhar("d1",1);
desenhar("d2",1);

</script>

</body>
</html>
