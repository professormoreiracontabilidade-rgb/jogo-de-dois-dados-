<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo dos Dados Mobile</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  background:radial-gradient(circle at top,#123b78,#02040a 70%);
  color:white;
  font-family:Arial, Helvetica, sans-serif;
  height:100vh;
  overflow:hidden;
}

.topo{
  height:70px;
  background:#071f4d;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#ffd400;
}

.sub{
  text-align:center;
  padding:14px;
  font-size:18px;
  font-weight:bold;
}

.area{
  height:calc(100vh - 130px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.dados{
  display:flex;
  gap:22px;
  margin-bottom:28px;
}

.dado{
  width:130px;
  height:130px;
  background:white;
  border-radius:24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);
  padding:14px;
  box-shadow:0 0 25px rgba(255,255,255,.45);
}

.ponto{
  width:20px;
  height:20px;
  background:#000;
  border-radius:50%;
  justify-self:center;
  align-self:center;
  visibility:hidden;
}

.resultado{
  font-size:54px;
  font-weight:bold;
  color:#ffd400;
  margin-top:10px;
}

.soma{
  margin-top:18px;
  background:#0b8f24;
  padding:14px 36px;
  border-radius:40px;
  font-size:28px;
  font-weight:bold;
}

.rodape{
  position:absolute;
  bottom:14px;
  width:100%;
  text-align:center;
  font-size:16px;
  color:#ddd;
}

.girando{
  animation:girar .22s linear infinite;
}

@keyframes girar{
  0%{transform:rotate(0deg) scale(.92);}
  50%{transform:rotate(180deg) scale(1.08);}
  100%{transform:rotate(360deg) scale(.92);}
}
</style>
</head>

<body onclick="controlarDados()">

<div class="topo">
🎲 JOGO DOS DADOS 🎲
</div>

<div class="sub" id="mensagem">
Toque na tela para começar
</div>

<div class="area">

  <div class="dados">
    <div class="dado" id="d1">
      <div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
      <div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
      <div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
    </div>

    <div class="dado" id="d2">
      <div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
      <div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
      <div class="ponto"></div><div class="ponto"></div><div class="ponto"></div>
    </div>
  </div>

  <div class="resultado" id="resultado">
    1 + 1
  </div>

  <div class="soma" id="soma">
    SOMA = 2
  </div>

</div>

<div class="rodape" id="rodape">
Toque para girar os dados
</div>

<script>
const faces = {
  1:[4],
  2:[0,8],
  3:[0,4,8],
  4:[0,2,6,8],
  5:[0,2,4,6,8],
  6:[0,2,3,5,6,8]
};

let girando = false;
let intervalo = null;
let valor1 = 1;
let valor2 = 1;

function desenhar(id, valor){
  let pontos = document.querySelectorAll("#" + id + " .ponto");

  pontos.forEach(p => p.style.visibility = "hidden");

  faces[valor].forEach(i => {
    pontos[i].style.visibility = "visible";
  });
}

function sorteio(){
  return Math.floor(Math.random() * 6) + 1;
}

function controlarDados(){
  if(!girando){
    iniciarGiro();
  }else{
    pararGiro();
  }
}

function iniciarGiro(){
  girando = true;

  document.getElementById("mensagem").innerHTML = "🎲 Dados girando rápido...";
  document.getElementById("rodape").innerHTML = "Toque na tela para parar";

  document.getElementById("d1").classList.add("girando");
  document.getElementById("d2").classList.add("girando");

  intervalo = setInterval(() => {
    valor1 = sorteio();
    valor2 = sorteio();

    desenhar("d1", valor1);
    desenhar("d2", valor2);

    document.getElementById("resultado").innerHTML = valor1 + " + " + valor2;
    document.getElementById("soma").innerHTML = "SOMA = " + (valor1 + valor2);
  }, 45);
}

function pararGiro(){
  girando = false;

  clearInterval(intervalo);

  valor1 = sorteio();
  valor2 = sorteio();

  desenhar("d1", valor1);
  desenhar("d2", valor2);

  document.getElementById("resultado").innerHTML = valor1 + " + " + valor2;
  document.getElementById("soma").innerHTML = "SOMA = " + (valor1 + valor2);

  document.getElementById("d1").classList.remove("girando");
  document.getElementById("d2").classList.remove("girando");

  document.getElementById("mensagem").innerHTML = "Resultado final";
  document.getElementById("rodape").innerHTML = "Toque novamente para girar";
}

desenhar("d1",1);
desenhar("d2",1);
</script>

</body>
</html>
